<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4분할 운동 플래너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F2EE; --surface:#FFFFFF; --ink:#16201B; --muted:#5F6B65; --line:#D9DDD6;
  --accent:#1E5EFF; --accent-ink:#FFFFFF; --soft:#E7ECFF; --chip:#E4E7E1;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141816; --surface:#1D231F; --ink:#E9ECE8; --muted:#98A39D; --line:#2E3733;
  --accent:#7DA0FF; --accent-ink:#0E1A3A; --soft:#22304F; --chip:#262D29; } }
:root[data-theme="dark"]{ --bg:#141816; --surface:#1D231F; --ink:#E9ECE8; --muted:#98A39D; --line:#2E3733;
  --accent:#7DA0FF; --accent-ink:#0E1A3A; --soft:#22304F; --chip:#262D29; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased}
.wrap{max-width:1060px; margin:0 auto; padding:28px 20px 80px}
header h1{font-size:1.05rem; font-weight:500; color:var(--muted); margin:0 0 6px}
header p{margin:0; color:var(--muted); font-size:.95rem; max-width:56ch}
.layout{display:grid; grid-template-columns:310px 1fr; gap:28px; align-items:start; margin-top:22px}
@media (max-width:840px){.layout{grid-template-columns:1fr}}
aside{position:sticky; top:calc(env(safe-area-inset-top,0px) + 16px); display:flex; flex-direction:column; gap:20px}
@media (max-width:840px){aside{position:static}}
.step h2{font-size:.9rem; font-weight:500; color:var(--muted); margin:0 0 8px}
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:4px}
.day{border:1px solid var(--line); border-radius:8px; padding:6px 2px; text-align:center; font-size:.8rem; line-height:1.25; color:var(--muted); background:var(--surface)}
.day b{display:block; font-size:.85rem; color:var(--ink); font-weight:700}
.day.today{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.day.free b{color:var(--muted); font-weight:500}
.parts{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:8px}
.part{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 6px 10px; cursor:pointer; text-align:center; color:var(--muted);
  font:inherit; font-weight:700; font-size:1.35rem; letter-spacing:-.02em; line-height:1}
.part small{display:block; font-size:.72rem; font-weight:500; margin-top:6px; color:var(--muted); letter-spacing:0}
.part[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.part[aria-pressed="true"] small{color:var(--bg); opacity:.75}
.part:focus-visible,.seg button:focus-visible,.ctr button:focus-visible,.regen:focus-visible,.swap:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.seg{display:flex; gap:4px; background:var(--chip); padding:4px; border-radius:10px}
.seg button{flex:1; border:0; border-radius:7px; background:none; padding:7px 4px; font:inherit; font-weight:500; color:var(--muted); cursor:pointer; font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.eq{display:flex; flex-direction:column; gap:6px; margin-top:8px}
.eqrow{display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 10px 8px 12px}
.eqrow.off{opacity:.55}
.eqrow .nm{font-weight:500}
.eqrow .nm small{display:block; color:var(--muted); font-size:.78rem; font-weight:400}
.ctr{display:inline-flex; align-items:center; gap:2px}
.ctr button{width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--chip); color:var(--ink); font:inherit; font-weight:700; cursor:pointer}
.ctr button:disabled{opacity:.35; cursor:default}
.ctr output{min-width:3.4ch; text-align:center; font-weight:700; font-variant-numeric:tabular-nums; font-size:.95rem}
.inline{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.people{display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:6px 10px}
.people .ctr output{font-size:1.1rem}
.regen{width:100%; padding:11px 12px; border-radius:10px; border:0; background:var(--accent); color:var(--accent-ink); font:inherit; font-weight:700; cursor:pointer}
main h2{font-size:1.5rem; font-weight:700; letter-spacing:-.02em; margin:0 0 2px}
main .sub{color:var(--muted); font-size:.95rem; margin:0 0 14px}
.warm{background:var(--soft); border-radius:12px; padding:14px 16px; font-size:.95rem; margin-bottom:18px}
.warm b,.rot b{font-weight:700}
.rot{border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:18px; font-size:.95rem; background:var(--surface)}
.cycle{margin-top:22px}
.cycle h3{font-size:1.05rem; font-weight:700; margin:0 0 10px; display:flex; align-items:baseline; gap:10px}
.cycle h3 span{color:var(--muted); font-weight:500; font-size:.9rem}
ol.routine{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px}
.ex{background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden}
.ex-head{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; padding:14px 16px; cursor:pointer}
.ex-head:focus-visible{outline:3px solid var(--accent); outline-offset:-3px}
.num{font-weight:700; font-size:1.6rem; line-height:1; color:var(--accent); min-width:1.4ch}
.slot{font-size:.78rem; font-weight:700; color:var(--accent); min-width:6.5ch; line-height:1.2}
.ex-title{font-weight:700; font-size:1.1rem; margin:0}
.ex-sub{color:var(--muted); font-size:.9rem; margin:3px 0 0}
.tag{display:inline-block; background:var(--chip); border-radius:6px; padding:2px 8px; font-size:.8rem; font-weight:500; margin-right:6px; color:var(--ink)}
.chev{width:22px; height:22px; color:var(--muted); transition:transform .2s}
.ex.open .chev{transform:rotate(180deg)}
.ex-body{display:none; padding:0 16px 16px; border-top:1px solid var(--line)}
.ex.open .ex-body{display:block}
.demo{display:block; width:100%; max-width:340px; aspect-ratio:11/10; margin:14px auto 0; background:var(--bg); border-radius:12px}
.demo-cap{text-align:center; color:var(--muted); font-size:.82rem; margin:6px 0 0}
.ex-body h4{margin:14px 0 6px; font-size:.9rem; font-weight:500; color:var(--muted)}
.ex-body ol{margin:0; padding-left:1.3em} .ex-body li{margin:4px 0} .ex-body ul{margin:0; padding-left:1.1em}
.swap{margin-top:14px; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:none; color:var(--ink); font:inherit; font-size:.9rem; cursor:pointer}
.swap:hover{border-color:var(--accent)}
.note{color:var(--muted); font-size:.88rem; margin:10px 0 0}
.empty{padding:24px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:14px}
footer{margin-top:40px; color:var(--muted); font-size:.85rem; max-width:64ch}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>4분할 운동 플래너</h1>
  <p>오늘 부위, 장소와 쓸 수 있는 기구, 인원, 시간을 고르면 루틴이 나옵니다. 여럿이면 기구 자리마다 운동을 배정하고 사이클로 돕니다.</p>
</header>

<div class="layout">
<aside>
  <section class="step">
    <h2>1. 오늘 할 부위</h2>
    <div class="week" id="week"></div>
    <div class="parts">
      <button class="part" data-part="back">등<small>월</small></button>
      <button class="part" data-part="chest">가슴<small>화</small></button>
      <button class="part" data-part="legs">하체<small>수</small></button>
      <button class="part" data-part="shoulder">어깨<small>목</small></button>
    </div>
  </section>

  <section class="step">
    <h2>2. 장소와 오늘 쓸 수 있는 기구</h2>
    <div class="seg" id="place"><button data-p="home">집</button><button data-p="gym">회사 헬스장</button></div>
    <div class="eq" id="eq"></div>
  </section>

  <section class="step">
    <div class="inline">
      <div><h2>3. 인원</h2>
        <div class="people"><span>명</span>
          <div class="ctr"><button id="pm" aria-label="인원 줄이기">−</button><output id="pv">1</output><button id="pp" aria-label="인원 늘리기">+</button></div>
        </div>
      </div>
      <div><h2>4. 시간</h2>
        <div class="seg" id="time"><button data-t="20">20분</button><button data-t="35">30~40분</button><button data-t="60">1시간</button></div>
      </div>
    </div>
  </section>

  <button class="regen" id="regen">다른 조합으로 다시 짜기</button>
</aside>

<main>
  <h2 id="title"></h2>
  <p class="sub" id="subtitle"></p>
  <div class="warm" id="warm"></div>
  <div class="rot" id="rot" hidden></div>
  <div id="out"></div>
  <p class="note" id="note"></p>
</main>
</div>

<footer>세트 사이 휴식은 60~90초. 마지막 세트에서 1~2회 남을 정도의 무게가 기준이고, 통증이 있으면 그 운동은 빼고 다음으로 넘어가면 됩니다.</footer>
</div>

<script>
// ── equipment: what the user counts, and which "slots" each unit provides ──
// slot = one place a person can stand and work. a cable machine unit = left cable + center bar + right cable.
const EQUIP = {

    {id:"kb",   name:"케틀벨", unit:"개",   hint:"1개 = 1자리",             slots:n=>Array.from({length:n},(_,i)=>({eq:"kb",   label:`케틀벨 ${n>1?i+1:""}`.trim()}))},

    {id:"bar",  name:"풀업바", unit:"개",   hint:"1개 = 1자리",             slots:n=>Array.from({length:n},(_,i)=>({eq:"bar",  label:`풀업바 ${n>1?i+1:""}`.trim()}))},

      slots:n=>[].concat(...Array.from({length:n},(_,i)=>{const p=n>1?`${i+1}번 `:""; return [{eq:"cable",label:`${p}케이블 왼쪽`},{eq:"bar",label:`${p}중앙 바`},{eq:"cable",label:`${p}케이블 오른쪽`}];}))},
    {id:"db",       name:"덤벨 · 벤치", unit:"자리", hint:"덤벨과 벤치를 동시에 쓸 수 있는 자리 수", slots:n=>Array.from({length:n},(_,i)=>({eq:"db",label:`덤벨 ${n>1?i+1:""}`.trim()}))},
    {id:"smith",    name:"스미스머신", unit:"대", hint:"1대 = 1자리", slots:n=>Array.from({length:n},(_,i)=>({eq:"smith",label:`스미스 ${n>1?i+1:""}`.trim()}))},
    {id:"legpress", name:"레그프레스", unit:"대", hint:"1대 = 1자리", slots:n=>Array.from({length:n},(_,i)=>({eq:"legpress",label:`레그프레스 ${n>1?i+1:""}`.trim()}))},
  ]
};
const EQNAME = {body:"맨몸", db:"덤벨", kb:"케틀벨", band:"밴드", bar:"바", cable:"케이블", smith:"스미스", legpress:"레그프레스"};
const PARTS = {
  back:{ name:"등", patterns:["vertical","horizontal","lat","scap","extension"],
    warm:"어깨뼈 조이기·벌리기 15회, 캣카우 10회, 가벼운 로우 15회. 등은 팔이 아니라 어깨뼈가 움직여야 하니 웜업에서 그 감각을 먼저 잡습니다." },
  chest:{ name:"가슴", patterns:["press","upper","fly","inner","stability"],
    warm:"팔 벌려 가슴 열기 15회, 무릎 대고 푸시업 10회, 어깨 돌리기. 손목이 뻐근하면 손목 돌리기도 1분." },
  legs:{ name:"하체", patterns:["squat","hinge","unilateral","glute","calf"],
    warm:"맨몸 스쿼트 15회, 힙힌지 연습 10회(엉덩이만 뒤로), 다리 앞뒤 스윙 각 10회, 발목 돌리기." },

const WEEK = ["일","월","화","수","목","금","토"];
const BASE = {1:"back", 2:"chest", 3:"legs", 4:"shoulder"};
// solo: exercises & sets. group: cycles × sets per cycle
const TIME = {20:{ex:3, sets:3, rest:60, cycles:1, gsets:4}, 35:{ex:5, sets:3, rest:75, cycles:2, gsets:4}, 60:{ex:7, sets:4, rest:75, cycles:3, gsets:4}};

const EX = [

{name:"밴드 숄더 프레스", part:"shoulder", pattern:"press", equip:["band"], pri:2, sets:3, reps:"12~15",

{name:"덤벨 레터럴 레이즈", part:"shoulder", pattern:"lateral", equip:["db"], pri:3, sets:3, reps:"12~15",

// ── Exercise demo animations: a 2D jointed figure, side or front view ──
// Angle conventions (side view, figure faces +x/right):
//  t  torso from vertical, + leans forward.        th thigh from straight-down, + knee forward
//  sh shin from straight-down (absolute)           ft foot from horizontal, + toes up
//  ua upper arm from straight-down, + forward, 180 = overhead, negative = behind
//  fa forearm absolute, same convention
// Front view: ab arm abduction (0 down, 90 = T, 180 overhead), el elbow bend (0 straight), la leg abduction, kn knee bend
const RIG = { torso:48, neck:7, head:9, ua:26, fa:24, th:40, sh:38, foot:14, shoulderW:15, hipW:9 };
const G = 185;                      // ground y
const R = d => d*Math.PI/180;

function sidePoints(p){
  const L = RIG;
  const vec = (len,a)=>[len*Math.sin(R(a)), len*Math.cos(R(a))];      // from straight-down
  let hip;
  if(p.hip) hip = p.hip.slice();
  else { const ank = p.ankle||[100,G]; const t1=vec(L.th,p.th), s1=vec(L.sh,p.sh); hip=[ank[0]-t1[0]-s1[0], ank[1]-t1[1]-s1[1]]; }
  const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
  const leg=(th,sh,ft)=>{ const k=add(hip,vec(L.th,th)); const a=add(k,vec(L.sh,sh)); const f=add(a,[L.foot*Math.cos(R(ft||0)), -L.foot*Math.sin(R(ft||0))]); return {k,a,f}; };
  const sh = add(hip,[L.torso*Math.sin(R(p.t)), -L.torso*Math.cos(R(p.t))]);
  const nk = add(sh,[L.neck*Math.sin(R(p.t)), -L.neck*Math.cos(R(p.t))]);
  const hd = add(nk,[L.head*Math.sin(R(p.t)), -L.head*Math.cos(R(p.t))]);
  const arm=(ua,fa)=>{ const e=add(sh,vec(L.ua,ua)); const h=add(e,vec(L.fa,fa)); return {e,h}; };
  const legs=[leg(p.th,p.sh,p.ft)]; if(p.th2!=null) legs.push(leg(p.th2,p.sh2??p.sh,p.ft2??p.ft));
  const arms=[arm(p.ua,p.fa)]; if(p.ua2!=null) arms.push(arm(p.ua2,p.fa2??p.fa));
  return {hip, sh, nk, hd, legs, arms, view:"side"};
}
function frontPoints(p){
  const L=RIG; const cx=110;
  const hipY = p.hipY ?? (G - L.th - L.sh);
  const kn = p.kn||0;                                    // knee bend shortens leg visually
  const legLen = (L.th+L.sh)*Math.cos(R(kn/2));
  const hipYc = p.hipY ?? (G - legLen);
  const hip=[cx,hipYc];
  const shY = hipYc - L.torso;
  const arm=(side,ab,el)=>{ const s=[cx+side*L.shoulderW, shY]; const e=[s[0]+side*L.ua*Math.sin(R(ab)), s[1]+L.ua*Math.cos(R(ab))];
    const fa = ab - el*side*0 - el;                         // elbow bend folds forearm toward midline/up
    const h=[e[0]+side*L.fa*Math.sin(R(fa)), e[1]+L.fa*Math.cos(R(fa))]; return {s,e,h}; };
  const leg=(side,la)=>{ const h=[cx+side*L.hipW, hipYc]; const k=[h[0]+side*(L.th*Math.sin(R(la))+kn*0.12), h[1]+L.th*Math.cos(R(la))*Math.cos(R(kn/2))]; const a=[h[0]+side*(L.th+L.sh)*Math.sin(R(la)), G]; return {h,k,a,f:[a[0]+side*5,a[1]]}; };
  const ab=p.ab, el=p.el||0;
  return {hip, sh:[cx,shY], nk:[cx,shY-L.neck], hd:[cx,shY-L.neck-L.head], view:"front",
    arms:[arm(-1,p.abL??ab,p.elL??el), arm(1,p.abR??ab,p.elR??el)], legs:[leg(-1,p.la||0),leg(1,p.la||0)]};
}

const NS="http://www.w3.org/2000/svg";
function el(tag, attrs){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); return e; }
function lerpPose(a,b,u){ const o={}; for(const k in a){ const av=a[k], bv=b[k]; if(Array.isArray(av)) o[k]=av.map((v,i)=>v+(bv[i]-v)*u); else if(typeof av==="number") o[k]=av+(bv-av)*u; else o[k]=av; } return o; }
const ease = u => u<.5 ? 2*u*u : 1-Math.pow(-2*u+2,2)/2;

function drawFigure(svg, pts, opts){
  svg.innerHTML="";
  const g = el("g",{fill:"none",stroke:"var(--ink)","stroke-width":4,"stroke-linecap":"round","stroke-linejoin":"round"});
  svg.appendChild(g);
  if(opts.extra==="bar-fixed"||opts.extra==="bar-at-hands"){ const hy = pts.view==="front" ? pts.arms[0].h[1] : pts.arms[0].h[1]; const BAR = opts.extra==="bar-fixed" ? 38 : (opts.barY||38); const dy = BAR - hy; g.setAttribute("transform",`translate(0 ${dy})`); }
  const line=(a,b,attrs)=>g.appendChild(el("line",{x1:a[0],y1:a[1],x2:b[0],y2:b[1],...(attrs||{})}));
  const poly=(arr,attrs)=>g.appendChild(el("polyline",{points:arr.map(p=>p.join(",")).join(" "),...(attrs||{})}));
  // ground (outside the translated group)
  svg.insertBefore(el("line",{x1:10,y1:G,x2:210,y2:G,stroke:"var(--line)","stroke-width":2}), g);
  // extras behind
  const ex = opts.extra||"";
  if(ex==="bench-under") g.appendChild(el("rect",{x:40,y:pts.hip[1]+6,width:120,height:8,rx:2,fill:"var(--chip)",stroke:"var(--line)","stroke-width":2}));
  if(ex==="bench-behind") g.appendChild(el("rect",{x:40,y:pts.sh[1]+2,width:34,height:G-pts.sh[1]-2,fill:"var(--chip)",stroke:"var(--line)","stroke-width":2}));
  if(ex==="bench-back"){ const b=pts.legs[1]; g.appendChild(el("rect",{x:20,y:b.a[1]+2,width:30,height:G-b.a[1]-2,fill:"var(--chip)",stroke:"var(--line)","stroke-width":2})); }
  if(ex==="bench-incline") g.appendChild(el("polygon",{points:`70,${G} 70,160 128,128 138,134 86,${G}`,fill:"var(--chip)",stroke:"var(--line)","stroke-width":2}));
  if(ex==="plate"){ const a=pts.legs[0].a; g.appendChild(el("rect",{x:a[0]+4,y:a[1]-26,width:8,height:52,rx:2,fill:"var(--chip)",stroke:"var(--line)","stroke-width":2})); }
  if(ex==="wall") g.appendChild(el("line",{x1:44,y1:30,x2:44,y2:G,stroke:"var(--line)","stroke-width":3}));
  // body
  const back = pts.view==="side" && pts.legs[1]; if(back){ poly([pts.hip,back.k,back.a,back.f],{stroke:"var(--muted)"}); }
  const backArm = pts.arms[1] && pts.view==="side" ? pts.arms[1] : null; if(backArm) poly([pts.sh,backArm.e,backArm.h],{stroke:"var(--muted)"});
  if(pts.view==="front"){ for(const l of pts.legs) poly([l.h,l.k,l.a,l.f]); line(pts.legs[0].h,pts.legs[1].h); }
  else { const l=pts.legs[0]; poly([pts.hip,l.k,l.a,l.f]); }
  line(pts.hip,pts.sh); line(pts.sh,pts.nk);
  g.appendChild(el("circle",{cx:pts.hd[0],cy:pts.hd[1],r:RIG.head,fill:"var(--surface)"}));
  if(pts.view==="front"){ line(pts.arms[0].s,pts.arms[1].s); for(const a of pts.arms) poly([a.s,a.e,a.h]); }
  else { const a=pts.arms[0]; poly([pts.sh,a.e,a.h]); }
  // props
  const hands = pts.view==="front" ? pts.arms.map(a=>a.h) : [pts.arms[0].h];
  const prop = opts.prop||"";
  const hl = "var(--accent)";
  const drawWeight = h => { g.appendChild(el("rect",{x:h[0]-9,y:h[1]-3,width:18,height:6,rx:2,fill:hl,stroke:"none"})); };
  if(prop==="hands"||prop==="hands-chest"||prop==="hands-hip") hands.forEach(drawWeight);
  if(prop.startsWith("cable")){
    let anchor = prop==="cable-high" ? [205,40] : prop==="cable-low" ? [205,170] : prop==="cable-back" ? [15,60] : prop==="cable-ankle-back" ? [15,170] : [205,60];
    const target = prop==="cable-ankle-back" && pts.legs[1] ? pts.legs[1].a : hands[0];
    g.appendChild(el("line",{x1:anchor[0],y1:anchor[1],x2:target[0],y2:target[1],stroke:hl,"stroke-width":2}));
    g.appendChild(el("rect",{x:anchor[0]-4,y:20,width:8,height:G-20,fill:"var(--chip)",stroke:"var(--line)","stroke-width":2}));
    g.appendChild(el("circle",{cx:anchor[0],cy:anchor[1],r:4,fill:hl}));
  }
  if(ex==="bar-hands"||ex==="bar-fixed"||ex==="bar-at-hands"){ const y=hands[0][1]; const xs=hands.map(h=>h[0]); const x1=Math.min(...xs)-22, x2=Math.max(...xs)+22; g.appendChild(el("line",{x1,y1:y,x2,y2:y,stroke:hl,"stroke-width":4}));
    if(ex!=="bar-hands"){ g.appendChild(el("line",{x1:x1,y1:y,x2:x1,y2:y-120,stroke:"var(--line)","stroke-width":3})); g.appendChild(el("line",{x1:x2,y1:y,x2:x2,y2:y-120,stroke:"var(--line)","stroke-width":3})); }
    if(ex==="bar-hands"){ g.appendChild(el("line",{x1:110,y1:y,x2:110,y2:10,stroke:hl,"stroke-width":2})); }
  }
  if(ex==="band-hands") g.appendChild(el("line",{x1:hands[0][0],y1:hands[0][1],x2:hands[1][0],y2:hands[1][1],stroke:hl,"stroke-width":3}));
  if(ex==="band-knees"){ const k=pts.legs.map(l=>l.k); g.appendChild(el("line",{x1:k[0][0],y1:k[0][1],x2:k[1][0],y2:k[1][1],stroke:hl,"stroke-width":3})); }
}

function computePoints(arch, pose){ return arch.view==="front" ? frontPoints(pose) : sidePoints(pose); }

// play: loops A→B→A. returns stop()
function playDemo(svg, name){
  const key = archetypeFor(name); const arch = A[key];
  svg.setAttribute("viewBox","0 0 220 200");
  const [fa,fb] = arch.frames; const dur = 1800;
  let raf, t0=performance.now();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function frame(now){
    let u = ((now-t0)%dur)/dur; u = u<.5 ? u*2 : 2-u*2;      // 0→1→0
    u = ease(u);
    const pose = lerpPose(fa,fb,u);
    drawFigure(svg, computePoints(arch,pose), arch);
    if(!reduce) raf = requestAnimationFrame(frame);
  }
  frame(t0);
  return ()=>cancelAnimationFrame(raf);
}


// ── state ──
const KEY = "hwp:v3";
const today = new Date().getDay();
const todayKey = new Date().toISOString().slice(0,10);
let state = { part:null, partDay:null, place:"home",
  counts:{ home:{db:1,kb:0,band:0,bar:0}, gym:{cable:1,db:0,smith:0,legpress:0} },
  people:1, time:35, seed:0 };
try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if(s && s.counts && s.counts.home) state = {...state, ...s}; }catch(e){}
if(state.partDay !== todayKey){ state.part = BASE[today] || state.part || "shoulder"; state.partDay = todayKey; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
let overrides = {}; // key "c-i" -> exercise name

// ── slots ──
function slots(){
  const list = [];
  for(const q of EQUIP[state.place]){ const n = state.counts[state.place][q.id]||0; if(n>0) list.push(...q.slots(n)); }
  return list;
}
function pool(part){ // exercises usable for this part in this place
  return EX.filter(e => (e.part===part || e.part==="any") && (state.place==="gym" || !e.gym));
}

// ── solo build: one per pattern, respecting available equipment types ──
function buildSolo(part){
  const P = PARTS[part]; const T = TIME[state.time];
  const have = new Set(["body", ...slots().map(s=>s.eq)]);
  const cand = pool(part).filter(e=>e.part!=="any" && e.equip.some(q=>have.has(q)));
  const chosen=[], names=new Set();
  const take = e => { chosen.push({...e, useEq:e.equip.find(q=>have.has(q)), sets:T.sets}); names.add(e.name); };
  for(const pat of P.patterns){
    if(chosen.length>=T.ex) break;
    const c = cand.filter(e=>e.pattern===pat).sort((a,b)=>b.pri-a.pri);
    if(!c.length) continue;
    const top = c.filter(e=>e.pri===c[0].pri); take(top[state.seed%top.length]);
  }
  for(const e of cand.sort((a,b)=>b.pri-a.pri)){ if(chosen.length>=T.ex) break; if(!names.has(e.name)) take(e); }
  return [{label:null, items:chosen.map(e=>({slot:{eq:e.useEq,label:null}, ex:e}))}];
}

// ── group build: each cycle assigns one exercise to every slot in use ──
function buildGroup(part){
  const P = PARTS[part]; const T = TIME[state.time];
  let S = slots();
  // if more slots than people, keep the first `people` slots but prefer slots that have exercises for this part
  const all = pool(part);
  const useful = s => all.some(e=>e.part===part && e.equip.includes(s.eq));
  if(S.length > state.people){
    S = [...S].sort((a,b)=>Number(useful(b))-Number(useful(a))).slice(0, state.people);
  }
  // fewer slots than people → add bodyweight slots up to people
  const bodySlots = Math.max(0, state.people - S.length);
  for(let i=0;i<bodySlots;i++) S.push({eq:"body", label:`맨몸 ${bodySlots>1?i+1:""}`.trim()});

  const used = new Set(); const patUsed = new Set(); const cycles = [];
  const score = e => (e.part===part?100:0) + (patUsed.has(e.pattern)?0:5) + e.pri*10;
  for(let c=0; c<T.cycles; c++){
    const items = [];
    for(const s of S){
      let c1 = all.filter(e=>!used.has(e.name) && e.equip.includes(s.eq));
      if(!c1.length) c1 = all.filter(e=>!used.has(e.name) && e.equip.includes("body")); // slot idle → bodyweight
      if(!c1.length) continue;
      c1.sort((a,b)=>score(b)-score(a));
      const top = c1.filter(e=>score(e)===score(c1[0]));
      const e = top[(state.seed + c) % top.length];
      used.add(e.name); patUsed.add(e.pattern);
      items.push({slot:s, ex:{...e, useEq:s.eq, sets:T.gsets}});
    }
    if(items.length) cycles.push({label:`${c+1}사이클`, items});
  }
  return cycles;
}
function applyOverrides(cycles){
  return cycles.map((cy,ci)=>({...cy, items:cy.items.map((it,i)=>{ const n=overrides[`${ci}-${i}`]; const r = n && EX.find(x=>x.name===n); return r ? {...it, ex:{...it.ex, ...r, sets:it.ex.sets, useEq:it.ex.useEq}} : it; })}));
}
function minutes(cycles){
  const T = TIME[state.time];
  if(state.people>1){
    const S = cycles[0]?.items.length||1;
    const share = Math.ceil(state.people / S);          // people per slot, alternating
    const perSet = Math.max(45+60, share*55);             // a slot cycles through its people
    return 5 + Math.round(cycles.length * T.gsets * perSet / 60);
  }
  const n = cycles[0]?.items.length||0;
  return 5 + Math.round(n*T.sets*(45+T.rest)/60);
}

let current = [];
function renderRoutine(){
  const P = PARTS[state.part]; const T = TIME[state.time]; const group = state.people>1;
  current = applyOverrides(group ? buildGroup(state.part) : buildSolo(state.part));

    : `혼자 · ${state.place==="gym"?"회사 헬스장":"집"} · ${T.sets}세트씩`;
  $("#warm").innerHTML = `<b>웜업 5분.</b> ${P.warm}`;
  const rot = $("#rot");
  if(group && S){

    rot.hidden=false;
    rot.innerHTML = `<b>진행 방식.</b> 사이클마다 자리별로 운동이 정해져 있습니다. 각 자리에서 ${T.gsets}세트를 마치면 다음 사이클로 넘어갑니다.
      ${share>1 ? `<br>${state.people}명이 ${S}자리를 쓰므로 한 자리에 ${share}명이 붙어 한 세트씩 교대로 합니다. 상대가 하는 동안이 휴식입니다.` : `<br>인원과 자리 수가 같아 각자 한 자리씩 맡고, 사이클이 바뀔 때 원하는 자리로 옮기면 됩니다.`}`;
    $("#note").textContent = current.some(c=>c.items.some(it=>it.ex.part==="any")) ? "부위 운동이 부족한 자리(주로 중앙 바)에는 복근 운동을 넣었습니다." : "";
  } else { rot.hidden=true; $("#note").textContent=""; }

  const out = $("#out"); out.innerHTML="";
  if(!n){ out.innerHTML = `<div class="empty">기구를 하나 이상 넣어주세요. 맨몸 운동은 자동으로 채워집니다.</div>`; return; }
  current.forEach((cy,ci)=>{
    const sec = document.createElement("section"); sec.className="cycle";
    if(cy.label) sec.innerHTML = `<h3>${cy.label} <span>${T.gsets}세트 × 10~15회, 자리 ${cy.items.length}개</span></h3>`;
    const ol = document.createElement("ol"); ol.className="routine";
    cy.items.forEach((it,i)=>{ const li = exCard(it,i,group); li.querySelector(".swap").addEventListener("click", ()=>swapOne(ci,i)); ol.appendChild(li); });
    sec.appendChild(ol); out.appendChild(sec);
  });
}
function swapOne(ci, i){
  const it = current[ci].items[i]; const cur = it.ex;
  const names = new Set(current.flatMap(c=>c.items.map(x=>x.ex.name)));
  const all = pool(state.part).filter(e=>e.equip.includes(cur.useEq) && (state.people>1 || e.pattern===cur.pattern));
  const alts = all.filter(e=>!names.has(e.name)).sort((a,b)=>(b.part===state.part)-(a.part===state.part) || b.pri-a.pri);
  const btn = document.querySelectorAll(".swap")[current.slice(0,ci).reduce((a,c)=>a+c.items.length,0)+i];
  if(!alts.length){ btn.textContent="이 자리에서 할 수 있는 대체 운동이 없습니다"; btn.disabled=true; return; }
  const idx = alts.findIndex(e=>e.name===(overrides[`${ci}-${i}`]||"")); // rotate through alts
  overrides[`${ci}-${i}`] = alts[(idx+1)%alts.length].name;
  renderRoutine();
  const li = document.querySelectorAll(".ex")[current.slice(0,ci).reduce((a,c)=>a+c.items.length,0)+i];
  if(li && li._open) li._open();
}

// ── wire ──
document.querySelectorAll(".part").forEach(b=>b.addEventListener("click", ()=>{ state.part=b.dataset.part; state.partDay=todayKey; overrides={}; save(); renderWeek(); renderRoutine(); }));
document.querySelectorAll("#place button").forEach(b=>b.addEventListener("click", ()=>{ state.place=b.dataset.p; overrides={}; save(); renderEq(); renderRoutine(); }));
$("#pm").addEventListener("click", ()=>{ state.people=Math.max(1,state.people-1); overrides={}; save(); renderControls(); renderRoutine(); });
$("#pp").addEventListener("click", ()=>{ state.people=Math.min(8,state.people+1); overrides={}; save(); renderControls(); renderRoutine(); });
document.querySelectorAll("#time button").forEach(b=>b.addEventListener("click", ()=>{ state.time=Number(b.dataset.t); overrides={}; save(); renderControls(); renderRoutine(); }));
$("#regen").addEventListener("click", ()=>{ state.seed=(state.seed+1)%7; overrides={}; save(); renderRoutine(); });

renderWeek(); renderEq(); renderControls(); renderRoutine();
</script>
</body>
</html>
