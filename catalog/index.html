<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>운동 카탈로그</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F2EE; --surface:#FFFFFF; --ink:#16201B; --muted:#5F6B65; --line:#D9DDD6;
  --accent:#1E5EFF; --accent-ink:#FFFFFF; --soft:#E7ECFF; --chip:#E4E7E1; --warn:#B45309;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141816; --surface:#1D231F; --ink:#E9ECE8; --muted:#98A39D; --line:#2E3733;
  --accent:#7DA0FF; --accent-ink:#0E1A3A; --soft:#22304F; --chip:#262D29; --warn:#F5B46B; } }
:root[data-theme="dark"]{ --bg:#141816; --surface:#1D231F; --ink:#E9ECE8; --muted:#98A39D; --line:#2E3733;
  --accent:#7DA0FF; --accent-ink:#0E1A3A; --soft:#22304F; --chip:#262D29; --warn:#F5B46B; }
*{box-sizing:inherit}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit; cursor:pointer}
.wrap{max-width:1180px; margin:0 auto; padding:24px 16px 80px}
header{display:flex; flex-wrap:wrap; gap:12px 20px; align-items:baseline; margin-bottom:18px}
header h1{font-size:1.05rem; font-weight:500; color:var(--muted); margin:0}
header .stats{color:var(--muted); font-size:.9rem; display:flex; gap:14px; flex-wrap:wrap}
header .stats b{color:var(--ink); font-weight:700}
.search{width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--surface); color:var(--ink); font:inherit; font-size:1rem; margin-bottom:14px}
.search:focus{outline:3px solid var(--accent); outline-offset:1px; border-color:transparent}
.parts{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px}
.parts button{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:7px 14px; font-weight:500; color:var(--muted)}
.parts button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.layout{display:grid; grid-template-columns:270px 1fr; gap:24px; align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
aside{display:flex; flex-direction:column; gap:16px; position:sticky; top:16px}
@media (max-width:860px){aside{position:static}}
.f{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px}
.f h2{font-size:.85rem; font-weight:500; color:var(--muted); margin:0 0 8px; display:flex; justify-content:space-between; align-items:center}
.f h2 button{border:0; background:none; color:var(--accent); font-size:.8rem; padding:0}
.f .grp{margin-top:8px}
.f .grp > span{display:block; font-size:.78rem; color:var(--muted); margin:6px 0 2px}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chips button{border:1px solid var(--line); background:var(--bg); border-radius:7px; padding:4px 9px; font-size:.85rem; color:var(--ink)}
.chips button[aria-pressed="true"]{background:var(--soft); border-color:var(--accent); color:var(--accent); font-weight:500}
.chips button small{color:var(--muted); font-weight:400; margin-left:3px}
.chips button[aria-pressed="true"] small{color:inherit}
.chips button:disabled{opacity:.35; cursor:default}
main .head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; gap:12px; flex-wrap:wrap}
main .head h2{font-size:1.3rem; font-weight:700; letter-spacing:-.02em; margin:0}
main .head .sub{color:var(--muted); font-size:.9rem}
.active{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px}
.active button{border:0; background:var(--soft); color:var(--accent); border-radius:7px; padding:3px 9px; font-size:.82rem; font-weight:500}
.active button::after{content:" ×"; opacity:.7}
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:10px; list-style:none; margin:0; padding:0}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px 16px; text-align:left; width:100%; display:flex; flex-direction:column; gap:8px}
.card:hover{border-color:var(--accent)}
.card:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.card .nm{font-weight:700; font-size:1.02rem; margin:0; line-height:1.3}
.card .meta{color:var(--muted); font-size:.82rem}
.tags{display:flex; flex-wrap:wrap; gap:4px}
.tag{display:inline-block; background:var(--chip); border-radius:6px; padding:1px 7px; font-size:.78rem; font-weight:500}
.tag.m{background:var(--soft); color:var(--accent)}
.tag.m2{background:transparent; border:1px solid var(--line); color:var(--muted)}
.empty{padding:36px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:14px}
/* detail */
dialog{border:0; border-radius:18px; padding:0; max-width:720px; width:calc(100% - 32px); background:var(--surface); color:var(--ink); box-shadow:0 24px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.d{padding:22px 24px 26px}
.d .top{display:flex; justify-content:space-between; gap:12px; align-items:flex-start}
.d h3{font-size:1.45rem; font-weight:700; letter-spacing:-.02em; margin:0 0 4px}
.d .meta{color:var(--muted); font-size:.9rem}
.d .close{border:1px solid var(--line); background:var(--bg); border-radius:999px; width:34px; height:34px; font-size:1.1rem; line-height:1; flex:none}
.d .cols{display:grid; grid-template-columns:260px 1fr; gap:20px; margin-top:16px}
@media (max-width:620px){.d .cols{grid-template-columns:1fr}}
.demo{display:block; width:100%; aspect-ratio:11/10; background:var(--bg); border-radius:12px}
video.demo{aspect-ratio:auto; max-height:300px; object-fit:contain}
.demo-cap{text-align:center; color:var(--muted); font-size:.8rem; margin:6px 0 0}
.views{display:inline-flex; gap:3px; background:var(--chip); padding:3px; border-radius:8px}
.views button{border:0; border-radius:6px; background:none; padding:3px 10px; font-size:.8rem; color:var(--muted)}
.views button[aria-pressed="true"]{background:var(--surface); color:var(--ink); font-weight:500}
.d h4{margin:14px 0 6px; font-size:.85rem; font-weight:500; color:var(--muted)}
.d h4:first-child{margin-top:0}
.d ol,.d ul{margin:0; padding-left:1.3em} .d li{margin:4px 0}
.d .rowtags{display:flex; flex-wrap:wrap; gap:5px}
.d .rowtags button{border:1px solid var(--line); background:var(--bg); border-radius:7px; padding:3px 9px; font-size:.84rem}
.d .rowtags button.m{background:var(--soft); border-color:transparent; color:var(--accent); font-weight:500}
.d .rowtags button:hover{border-color:var(--accent)}
.d .kv{display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:.9rem; margin-top:10px}
.d .kv span:nth-child(odd){color:var(--muted)}
footer{margin-top:40px; color:var(--muted); font-size:.85rem}
footer code{font-size:.82rem}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>운동 카탈로그</h1>
  <div class="stats" id="stats"></div>
  <nav style="margin-left:auto;font-size:.9rem"><a href="body.html" style="color:var(--accent)">근육 지도 →</a></nav>
</header>
<input class="search" id="q" type="search" placeholder="운동 이름, 근육, 장비로 검색 (예: 후면 삼각근, 케틀벨, 로우)" autocomplete="off">
<div class="parts" id="parts"></div>
<div class="layout">
  <aside>
    <section class="f"><h2>장비 <button id="clr-eq" hidden>지우기</button></h2><div id="f-eq"></div></section>
    <section class="f"><h2>근육 <button id="clr-m" hidden>지우기</button></h2><div id="f-m"></div></section>
    <section class="f"><h2>동작 패턴 <button id="clr-p" hidden>지우기</button></h2><div id="f-p" class="chips"></div></section>
  </aside>
  <main>
    <div class="head"><h2 id="count"></h2><span class="sub">필터는 그룹 안에서는 OR, 그룹끼리는 AND로 적용됩니다.</span></div>
    <div class="active" id="active"></div>
    <ul class="grid" id="grid"></ul>
  </main>
</div>
<footer>데이터: <code>data/db.js</code> (운동 114 · 장비 11 · 근육 26 · 동작 패턴 21). <code>python3 scripts/build_data.py</code>로 <code>docs/database-spec.md</code>에서 재생성합니다. 근육 매핑은 동작 패턴 기본값 + 운동별 예외 규칙으로 생성한 초안입니다.</footer>
</div>
<dialog id="dlg"><div class="d" id="detail"></div></dialog>
<script src="../data/db.js"></script>
<script src="anim.js"></script>
<script src="app.js"></script>
</body>
</html>
