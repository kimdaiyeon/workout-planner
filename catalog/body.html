<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>근육 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F2EE; --surface:#FFFFFF; --ink:#16201B; --muted:#5F6B65; --line:#D9DDD6;
  --accent:#1E5EFF; --accent-ink:#FFFFFF; --soft:#E7ECFF; --chip:#E4E7E1;
  --skin:#D9C9B6; --muscle:#B85C4A; --muscle2:#D9A08F; --canvas:#E9EBE5;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141816; --surface:#1D231F; --ink:#E9ECE8; --muted:#98A39D; --line:#2E3733;
  --accent:#7DA0FF; --accent-ink:#0E1A3A; --soft:#22304F; --chip:#262D29;
  --skin:#6E645A; --muscle:#A8503F; --muscle2:#C9836F; --canvas:#1A1F1C; } }
*{box-sizing:inherit}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit; cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:1180px; margin:0 auto; padding:24px 16px 60px}
header{display:flex; flex-wrap:wrap; gap:12px 20px; align-items:baseline; margin-bottom:16px}
header h1{font-size:1.05rem; font-weight:500; color:var(--muted); margin:0}
header nav{font-size:.9rem; color:var(--muted)}
.layout{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr); gap:22px; align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.stage{position:relative; background:var(--canvas); border:1px solid var(--line); border-radius:16px; overflow:hidden; aspect-ratio:3/4; max-height:78vh}
.stage canvas{display:block; width:100%; height:100%; touch-action:none}
.bar{position:absolute; top:12px; left:12px; right:12px; display:flex; justify-content:space-between; gap:8px; pointer-events:none}
.seg{display:flex; gap:3px; background:var(--chip); padding:3px; border-radius:9px; pointer-events:auto}
.seg button{border:0; border-radius:7px; background:none; padding:6px 12px; font-weight:500; color:var(--muted); font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tip{position:absolute; pointer-events:none; background:var(--ink); color:var(--bg); font-size:.82rem; padding:4px 9px; border-radius:7px; transform:translate(-50%,-140%); white-space:nowrap; display:none}
.hint{position:absolute; bottom:12px; left:12px; right:12px; text-align:center; color:var(--muted); font-size:.82rem; pointer-events:none}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:18px 20px; min-height:300px}
.panel .empty{color:var(--muted); padding:24px 0; text-align:center}
.panel h2{font-size:1.45rem; font-weight:700; letter-spacing:-.02em; margin:0 0 2px}
.panel .meta{color:var(--muted); font-size:.9rem; margin-bottom:12px}
.panel h3{font-size:.85rem; font-weight:500; color:var(--muted); margin:16px 0 6px; display:flex; justify-content:space-between; align-items:baseline}
.panel h3 a{font-size:.8rem; font-weight:400}
.panel ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.panel li a{display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px 12px; color:var(--ink); text-decoration:none}
.panel li a:hover{border-color:var(--accent)}
.panel li .nm{font-weight:500}
.panel li .sub{color:var(--muted); font-size:.8rem; margin-top:1px}
.tags{display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end}
.tag{display:inline-block; background:var(--chip); border-radius:6px; padding:1px 7px; font-size:.76rem; font-weight:500}
.legend{display:flex; flex-wrap:wrap; gap:5px; margin-top:14px}
.legend button{border:1px solid var(--line); background:var(--bg); border-radius:7px; padding:3px 9px; font-size:.82rem}
.legend button[aria-pressed="true"]{background:var(--soft); border-color:var(--accent); color:var(--accent); font-weight:500}
.legend .g{width:100%; font-size:.76rem; color:var(--muted); margin-top:4px}
footer{margin-top:28px; color:var(--muted); font-size:.85rem}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div class="wrap">
<header>
  <h1>근육 지도</h1>
  <nav><a href="./">운동 카탈로그</a>로 돌아가기</nav>
</header>
<div class="layout">
  <div class="left">
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="bar">
      <div class="seg" id="sex"><button data-s="m" aria-pressed="true">남자</button><button data-s="f">여자</button></div>
      <div class="seg" id="view"><button data-v="front" aria-pressed="true">앞</button><button data-v="back">뒤</button><button data-v="side">옆</button></div>
    </div>
    <div class="tip" id="tip"></div>
    <div class="hint">근육을 클릭하면 운동이 나옵니다 · 드래그로 회전</div>
  </div>
  <div class="legend" id="legend"></div>
  </div>
  <aside class="panel" id="panel"><div class="empty">모델의 근육을 클릭하세요.</div></aside>
</div>
<footer>모델은 코드로 생성한 마네킹이며 근육 위치는 대략적입니다. 근육 26종은 <code>data/muscles.json</code>, 운동 연결은 <code>data/exercises.json</code>의 주동근·협력근을 그대로 씁니다.</footer>
</div>
<script src="../data/db.js"></script>
<script type="module" src="body.js"></script>
</body>
</html>
